name: Vigia dos agendamentos

# Reserva do cron-job.org (ver docs/operacao.md). Se uma rotina não começou no
# horário, chama a rotina daqui mesmo e termina com falha pro GitHub mandar
# e-mail. Atraso do agendamento do GitHub não atrapalha: aqui ele é só reserva.
on:
  schedule:
    # 8h17, 10h17, 12h17, 14h17, 16h17, 18h17, 20h17 e 21h17 em Maceió.
    - cron: '17 11,13,15,17,19,21,23,0 * * *'
  workflow_dispatch:
    inputs:
      testar_aviso:
        description: 'Testar: chama /api/verificar-itens e termina com falha pra conferir o e-mail'
        type: boolean
        default: false

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigiar:
    if: github.repository != 'Eduardo-Brrs/monitor-licitacoes-saude'  # cópia pública: sem secrets, não roda
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Conferir agendamentos e rodar o que parou
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TESTAR_AVISO: ${{ inputs.testar_aviso }}
        run: |
          BASE="${{ secrets.APP_URL }}"

          if [ "$TESTAR_AVISO" = "true" ]; then
            ROTAS="/api/verificar-itens"
          else
            if ! RESPOSTA=$(curl -sf --retry 2 --retry-delay 20 --retry-all-errors --max-time 60 \
              -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/vigia"); then
              echo "::error::O site não respondeu ao vigia. Ver docs/operacao.md, caso 2."
              exit 1
            fi
            echo "$RESPOSTA" | jq .
            ROTAS=$(echo "$RESPOSTA" | jq -r '.paradas[].rota')
            PRESOS=$(echo "$RESPOSTA" | jq -r '.presos[]? | "\(.fila)/\(.chave): \(.erro)"')
          fi

          if [ -n "${PRESOS:-}" ]; then
            echo "::error::Item preso em fila há mais de 24h. Ver docs/operacao.md, caso 3."
            echo "$PRESOS"
          fi

          if [ -z "$ROTAS" ]; then
            if [ -n "${PRESOS:-}" ]; then exit 1; fi
            echo "Agendamentos em dia."
            exit 0
          fi

          for ROTA in $ROTAS; do
            echo "Rodando $ROTA"
            if ! curl -s --max-time 90 -w "\nHTTP %{http_code}\n" \
              -H "Authorization: Bearer $CRON_SECRET" "$BASE$ROTA"; then
              echo "::warning::$ROTA não terminou."
            fi
          done

          echo "::error::Agendamento parado. O vigia rodou no lugar: $(echo $ROTAS). Ver docs/operacao.md, caso 1."
          exit 1
