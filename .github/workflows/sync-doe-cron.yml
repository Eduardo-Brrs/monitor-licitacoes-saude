name: Sync Diario Oficial AL

on:
  schedule:
    # Mesma cadência do Sync PNCP (9h/14h/20h Maceió) — sem dado ainda sobre o
    # horário real de publicação do DOE-AL, ajustar depois se necessário.
    - cron: '0 12 * * *'
    - cron: '0 17 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/sync-doe
        run: |
          curl -sf -w "\nHTTP %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/sync-doe"
