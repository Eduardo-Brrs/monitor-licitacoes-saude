name: Sync Diario Oficial AL

on:
  # Agendamento migrou pro cron-job.org em 2026-10-02 (ver docs/operacao.md).
  # Fica só o disparo manual, como reserva.
  workflow_dispatch: {}

jobs:
  sync:
    if: github.repository != 'Eduardo-Brrs/monitor-licitacoes-saude'  # cópia pública: sem secrets, não roda
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/sync-doe
        run: |
          curl -sf -w "\nHTTP %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/sync-doe"
