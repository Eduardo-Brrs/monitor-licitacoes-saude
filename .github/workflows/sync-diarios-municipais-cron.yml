name: Sync Diarios Municipais

on:
  schedule:
    # Mesma cadência do Sync PNCP e do DOE-AL (9h/14h/20h Maceió), deslocada
    # 10 min pra não bater as três rotas na Vercel no mesmo minuto.
    - cron: '10 12 * * *'
    - cron: '10 17 * * *'
    - cron: '10 23 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/sync-diarios-municipais
        run: |
          curl -sf -w "\nHTTP %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/sync-diarios-municipais"
